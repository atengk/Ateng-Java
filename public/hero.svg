<svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 64 64"
        width="320"
        height="320"
        aria-hidden="true"
        role="img"
>
    <defs>
        <linearGradient id="logoGradient" x1="8%" y1="10%" x2="92%" y2="88%">
            <stop offset="0%" stop-color="#d8ffb8" />
            <stop offset="32%" stop-color="#7ddf57" />
            <stop offset="68%" stop-color="#39b86f" />
            <stop offset="100%" stop-color="#b8ffe2" />
        </linearGradient>

        <linearGradient id="strokeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#f3ffe7" stop-opacity=".95" />
            <stop offset="45%" stop-color="#caffbf" stop-opacity=".4" />
            <stop offset="100%" stop-color="#8ff3d2" stop-opacity=".18" />
        </linearGradient>

        <linearGradient id="shimmerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="44%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="50%" stop-color="#ffffff" stop-opacity=".5" />
            <stop offset="56%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
            <animateTransform
                    attributeName="gradientTransform"
                    type="translate"
                    from="-1 0"
                    to="1 0"
                    dur="4.2s"
                    repeatCount="indefinite"
            />
        </linearGradient>

        <radialGradient id="ringGradient" cx="50%" cy="50%" r="50%">
            <stop offset="72%" stop-color="#ffffff" stop-opacity="0" />
            <stop offset="88%" stop-color="#8cffc4" stop-opacity=".12" />
            <stop offset="100%" stop-color="#dffff1" stop-opacity=".28" />
        </radialGradient>

        <radialGradient id="particleGlow" cx="50%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#f6fff9" stop-opacity=".95" />
            <stop offset="100%" stop-color="#b8ffe2" stop-opacity=".18" />
        </radialGradient>

        <clipPath id="logoClip">
            <path d="M58.2 3.365a29.503 29.503 0 0 1-3.419 6.064A32.094 32.094 0 1 0 9.965 55.372l1.186 1.047a32.08 32.08 0 0 0 52.67-22.253c.875-8.17-1.524-18.51-5.62-30.8zM14.53 55.558a2.744 2.744 0 1 1-.404-3.857 2.744 2.744 0 0 1 .404 3.857zm43.538-9.61c-7.92 10.55-24.83 6.99-35.672 7.502 0 0-1.922.113-3.857.43 0 0 .73-.31 1.663-.663 7.614-2.65 11.213-3.16 15.838-5.54 8.708-4.427 17.322-14.122 19.112-24.2-3.313 9.695-13.373 18.032-22.53 21.418-6.276 2.313-17.614 4.566-17.614 4.566l-.457-.245c-7.714-3.75-7.952-20.457 6.077-25.845 6.143-2.366 12.02-1.067 18.654-2.65 7.084-1.683 15.28-6.99 18.615-13.916 3.73 11.08 8.224 28.422.166 39.15z" />
        </clipPath>

        <style>
            .safe-wrap {
            transform-origin: 32px 32px;
            }

            .hero-core {
            transform-origin: 32px 32px;
            animation: breatheSafe 4.8s ease-in-out infinite;
            }

            .hero-outline {
            animation: outlinePulse 4.2s ease-in-out infinite;
            }

            .ring {
            transform-origin: 32px 32px;
            animation: ringPulse 6s ease-in-out infinite;
            }

            .particle {
            animation: particleFloat 5.4s ease-in-out infinite;
            }

            .particle.p2 { animation-delay: .9s; }
            .particle.p3 { animation-delay: 1.7s; }
            .particle.p4 { animation-delay: 2.4s; }

            @keyframes breatheSafe {
            0%, 100% {
            transform: scale(1);
            opacity: 1;
            }
            50% {
            transform: scale(1.012);
            opacity: .975;
            }
            }

            @keyframes outlinePulse {
            0%, 100% { opacity: .34; }
            50% { opacity: .72; }
            }

            @keyframes ringPulse {
            0%, 100% {
            transform: scale(.985);
            opacity: .42;
            }
            50% {
            transform: scale(1);
            opacity: .68;
            }
            }

            @keyframes particleFloat {
            0%, 100% {
            transform: translateY(0);
            opacity: .26;
            }
            50% {
            transform: translateY(-1.2px);
            opacity: .72;
            }
            }
        </style>
    </defs>

    <circle class="ring" cx="32" cy="32" r="28.5" fill="url(#ringGradient)" />

    <g class="safe-wrap" transform="translate(1.28 1.28) scale(0.96)">
        <g class="hero-core">
            <path
                    d="M58.2 3.365a29.503 29.503 0 0 1-3.419 6.064A32.094 32.094 0 1 0 9.965 55.372l1.186 1.047a32.08 32.08 0 0 0 52.67-22.253c.875-8.17-1.524-18.51-5.62-30.8zM14.53 55.558a2.744 2.744 0 1 1-.404-3.857 2.744 2.744 0 0 1 .404 3.857zm43.538-9.61c-7.92 10.55-24.83 6.99-35.672 7.502 0 0-1.922.113-3.857.43 0 0 .73-.31 1.663-.663 7.614-2.65 11.213-3.16 15.838-5.54 8.708-4.427 17.322-14.122 19.112-24.2-3.313 9.695-13.373 18.032-22.53 21.418-6.276 2.313-17.614 4.566-17.614 4.566l-.457-.245c-7.714-3.75-7.952-20.457 6.077-25.845 6.143-2.366 12.02-1.067 18.654-2.65 7.084-1.683 15.28-6.99 18.615-13.916 3.73 11.08 8.224 28.422.166 39.15z"
                    fill="url(#logoGradient)"
            />

            <path
                    class="hero-outline"
                    d="M58.2 3.365a29.503 29.503 0 0 1-3.419 6.064A32.094 32.094 0 1 0 9.965 55.372l1.186 1.047a32.08 32.08 0 0 0 52.67-22.253c.875-8.17-1.524-18.51-5.62-30.8zM14.53 55.558a2.744 2.744 0 1 1-.404-3.857 2.744 2.744 0 0 1 .404 3.857zm43.538-9.61c-7.92 10.55-24.83 6.99-35.672 7.502 0 0-1.922.113-3.857.43 0 0 .73-.31 1.663-.663 7.614-2.65 11.213-3.16 15.838-5.54 8.708-4.427 17.322-14.122 19.112-24.2-3.313 9.695-13.373 18.032-22.53 21.418-6.276 2.313-17.614 4.566-17.614 4.566l-.457-.245c-7.714-3.75-7.952-20.457 6.077-25.845 6.143-2.366 12.02-1.067 18.654-2.65 7.084-1.683 15.28-6.99 18.615-13.916 3.73 11.08 8.224 28.422.166 39.15z"
                    fill="none"
                    stroke="url(#strokeGradient)"
                    stroke-width=".42"
                    stroke-linejoin="round"
            />

            <g clip-path="url(#logoClip)" opacity=".92">
                <rect x="-22" y="0" width="28" height="64" fill="url(#shimmerGradient)" transform="rotate(12 32 32)">
                    <animate attributeName="x" from="-22" to="72" dur="4.2s" repeatCount="indefinite" />
                </rect>
            </g>
        </g>
    </g>

    <g>
        <circle class="particle p1" cx="13.5" cy="18" r=".9" fill="url(#particleGlow)">
            <animate attributeName="cy" values="18;16.8;18" dur="5.2s" repeatCount="indefinite" />
        </circle>
        <circle class="particle p2" cx="50.5" cy="14" r=".75" fill="url(#particleGlow)">
            <animate attributeName="cy" values="14;12.9;14" dur="5.8s" repeatCount="indefinite" />
        </circle>
        <circle class="particle p3" cx="54" cy="46.5" r=".95" fill="url(#particleGlow)">
            <animate attributeName="cy" values="46.5;45.2;46.5" dur="6s" repeatCount="indefinite" />
        </circle>
        <circle class="particle p4" cx="16.5" cy="50.5" r=".7" fill="url(#particleGlow)">
            <animate attributeName="cy" values="50.5;49.4;50.5" dur="4.8s" repeatCount="indefinite" />
        </circle>
    </g>
</svg>