<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="320" height="320">
    <defs>
        <!-- 复用主路径 -->
        <path id="shape" d="M58.2 3.365a29.5 29.5 0 0 1-3.42 6.064A32.09 32.09 0 1 0 9.97 55.37l1.19 1.05a32.08 32.08 0 0 0 52.66-22.25c.88-8.17-1.52-18.51-5.62-30.8zM14.53 55.56a2.74 2.74 0 1 1-.4-3.86 2.74 2.74 0 0 1 .4 3.86zm43.54-9.61c-7.92 10.55-24.83 6.99-35.67 7.5 0 0-1.92.11-3.86.43 0 0 .73-.31 1.66-.66 7.61-2.65 11.21-3.16 15.84-5.54 8.71-4.43 17.32-14.12 19.11-24.2-3.31 9.7-13.37 18.03-22.53 21.42-6.28 2.31-17.61 4.56-17.61 4.56l-.46-.25c-7.71-3.75-7.95-20.46 6.08-25.85 6.14-2.37 12.02-1.07 18.65-2.65 7.08-1.68 15.28-6.99 18.61-13.92 3.73 11.08 8.23 28.42.17 39.15z"/>

        <!-- 边界裁剪（核心） -->
        <clipPath id="clip">
            <use href="#shape"/>
        </clipPath>

        <!-- 主渐变 -->
        <linearGradient id="grad-main" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#7ED957"/>
            <stop offset="50%" stop-color="#4CAF50"/>
            <stop offset="100%" stop-color="#2E7D32"/>
        </linearGradient>

        <!-- 高光流动（仍然允许移动，但会被裁剪） -->
        <linearGradient id="grad-shine" x1="-100%" y1="0%" x2="200%" y2="0%">
            <stop offset="0%" stop-color="rgba(255,255,255,0)" />
            <stop offset="50%" stop-color="rgba(255,255,255,0.6)" />
            <stop offset="100%" stop-color="rgba(255,255,255,0)" />
            <animate attributeName="x1" from="-100%" to="100%" dur="3s" repeatCount="indefinite"/>
            <animate attributeName="x2" from="0%" to="200%" dur="3s" repeatCount="indefinite"/>
        </linearGradient>
    </defs>

    <!-- 主体 -->
    <use href="#shape" fill="url(#grad-main)">
        <!-- 呼吸动画（缩小幅度，避免视觉越界） -->
        <animateTransform
                attributeName="transform"
                type="scale"
                values="1;1.015;1"
                dur="3s"
                repeatCount="indefinite"
        />
    </use>

    <!-- 高光层（强制裁剪） -->
    <g clip-path="url(#clip)">
        <rect x="0" y="0" width="64" height="64" fill="url(#grad-shine)" opacity="0.4"/>
    </g>
</svg>