---
# 服务配置
server:
  # 服务端口
  port: 17005

# Spring 配置
spring:
  application:
    # 应用名称
    name: ${project.artifactId}

# 日志配置
logging:
  level:
    # 默认日志级别
    root: INFO
    # 项目包日志级别
    io.github.atengk: DEBUG
---
# RestClient 配置
remote:
  http:
    logging:
      # 是否启用远程调用日志
      enabled: true

      # 是否打印请求头；敏感 Header 会自动脱敏
      include-headers: true

      # 是否打印请求体；生产环境建议关闭，避免输出敏感数据或大对象
      include-request-body: false

      # 请求体日志最大长度
      max-request-body-length: 2048

      # 敏感 Header，不区分大小写
      sensitive-headers:
        - Authorization
        - Cookie
        - Set-Cookie
        - X-API-Key
        - X-App-Secret

    trace:
      # 是否启用 TraceId 透传
      enabled: true

      # MDC 中保存 TraceId 的 key
      mdc-name: traceId

      # 向远程服务透传的请求头名称
      header-name: X-Trace-Id

      # MDC 不存在 TraceId 时是否自动生成
      generate-if-absent: true

    error-handling:
      # 是否启用统一错误处理
      enabled: true

      # 错误响应体最大保存长度
      max-response-body-length: 4096

    default-config:
      # 默认基础地址，允许为空；为空时调用方需要使用完整 URL
      base-url:

      # 建立 TCP 连接的超时时间
      connect-timeout: 3s

      # 从连接池获取连接的超时时间
      connection-request-timeout: 2s

      # 等待服务端响应的超时时间
      response-timeout: 10s

      # 最大空闲连接存活时间
      max-idle-time: 30s

      # 总连接池大小
      max-conn-total: 200

      # 单个路由最大连接数
      max-conn-per-route: 50

      # 默认请求头
      default-headers:
        Accept: application/json

      proxy:
        # 代理默认关闭，后续 proxyRestClient 使用
        enabled: false
        scheme: http
        host:
        port: 0
        username:
        password:

      ssl:
        # SSL 扩展默认关闭，后续 mtlsRestClient / unsafeSslRestClient 使用
        enabled: false

        # 是否信任所有证书，仅允许测试环境使用
        trust-all: false

        # 是否启用主机名校验，生产环境必须开启
        hostname-verification-enabled: true

        # TLS 协议
        protocol: TLS

        # 客户端证书，后续 mTLS 使用
        key-store-path:
        key-store-password:
        key-store-type: PKCS12

        # 信任证书，后续自定义 CA 使用
        trust-store-path:
        trust-store-password:
        trust-store-type: PKCS12

    clients:
      # 普通 JSON 接口调用
      default:
        base-url: https://api.example.com
        connect-timeout: 3s
        connection-request-timeout: 2s
        response-timeout: 10s
        max-idle-time: 30s
        max-conn-total: 200
        max-conn-per-route: 50
        default-headers:
          Accept: application/json

      # 快速失败客户端，适合实时查询类接口
      fast:
        base-url: https://api.example.com
        connect-timeout: 1s
        connection-request-timeout: 1s
        response-timeout: 3s
        max-idle-time: 20s
        max-conn-total: 200
        max-conn-per-route: 50
        default-headers:
          Accept: application/json

      # 长耗时客户端，适合报表导出、大文件处理、AI 生成等接口
      long:
        base-url: https://api.example.com
        connect-timeout: 5s
        connection-request-timeout: 3s
        response-timeout: 60s
        max-idle-time: 60s
        max-conn-total: 100
        max-conn-per-route: 30
        default-headers:
          Accept: application/json